name: Lint

on:
  push: 
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout 
        uses: actions/checkout@v4
      
      - name: Install tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check formatting
        run: stylua --check .

      - name: Lint
        run: selene .